[package]
name = "mandelbrot_set"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause-Clear"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
image = "0.25"
indicatif = "0.18"
num-complex = "0.4"
pollster = "1.0"
rayon = "1.12"
tracing = "0.1"
tracing-indicatif = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = "30.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 3
