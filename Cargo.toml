[package]
name = "mandelbrot_set"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause-Clear"
license-file = "LICENSE.txt"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
image = "0.25"
num-complex = "0.4"
rayon = "1.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
